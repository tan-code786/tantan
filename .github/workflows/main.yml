name: System Check

on:
  workflow_dispatch: 

concurrency: 
  group: tracker-bot

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install requests beautifulsoup4 playwright playwright-stealth
          playwright install chromium

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SELLERS: ${{ secrets.SELLERS }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python app.py

      - name: Save memory back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
